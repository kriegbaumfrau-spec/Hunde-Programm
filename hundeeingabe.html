<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Haustier bearbeiten | PetConnect</title>
  <link rel="stylesheet" href="hundeeingabe.css">
</head>

<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="logo" onclick="goBack()">
      <span class="logo-icon">🐾</span>
      <div>
        <h1>PetConnect</h1>
        <p>Weil sie Familie sind.</p>
      </div>
    </div>

    <nav>
      <a href="index.html">Übersicht</a>
      <a href="hundeeingabe.html" class="active">Haustiere</a>
      <a href="view.html">QR-Codes</a>
    </nav>
  </header>


  <!-- Hintergrund -->
  <main class="page-background">

    <button onclick="goBack()" class="top-back-btn">← Zurück</button>

    <!-- Formular-Karte -->
    <section class="profile-card">

      <div class="form-header">
        <h2>Mein Haustier</h2>
        <p>Bearbeite die wichtigsten Informationen zu deinem Haustier.</p>
      </div>

      <!-- Profilbild -->
      <div class="image-wrapper">
        <img id="dogImage" src="tier-icon.png" class="dog-img" alt="Profilbild Haustier">

        <div class="camera-icon">
          <img src="camera-icon.png" alt="Kamera">
        </div>
      </div>

      <input type="file" id="imageInput" accept="image/*" style="display:none;">


      <!-- Formular -->
      <div class="form-grid">

        <div class="field">
          <label for="name">Name</label>
          <input id="name" placeholder="z.B. Mailo">
        </div>

        <div class="field">
          <label for="species">Tierart</label>
          <select id="species">
            <option value="">Bitte wählen</option>
            <option value="dog">Hund</option>
            <option value="cat">Katze</option>
            <option value="other">Sonstige</option>
          </select>
        </div>

        <div class="field">
          <label for="breed">Rasse</label>
          <input id="breed" placeholder="z.B. Kleinpudel">
        </div>

        <div class="field">
          <label for="gender">Geschlecht</label>
          <select id="gender">
            <option value="">Bitte wählen</option>
            <option value="male">Männlich</option>
            <option value="female">Weiblich</option>
          </select>
        </div>

        <div class="field">
          <label for="birthday">Geburtstag</label>
          <input type="date" id="birthday">
        </div>

        <div class="field">
          <label for="kastriert">Kastriert/sterilisiert</label>
          <select id="kastriert">
            <option value="">Bitte wählen</option>
            <option value="ja">Ja</option>
            <option value="nein">Nein</option>
          </select>
        </div>

        <div class="field">
          <label for="weight">Gewicht (kg)</label>
          <input id="weight" placeholder="z.B. 8">
        </div>

        <div class="field">
          <label for="chipNumber">Chip-Nummer</label>
          <input id="chipNumber" placeholder="z.B. 48790815">
        </div>

        <div class="field full-width">
          <label for="note">Weitere Informationen</label>
          <textarea id="note" placeholder="z.B. Allergie gegen Huhn"></textarea>
        </div>

      </div>


      <!-- Kontaktpersonen -->
      <div class="contacts-section">

        <h3>Kontaktperson</h3>

        <div id="contactList"></div>

        <div id="addForm" class="add-form">
          <input id="newName" placeholder="Name der Kontaktperson">
          <input id="newPhone" placeholder="Telefonnummer">
          <button onclick="saveContact()" class="add-save-btn">Hinzufügen</button>
        </div>

        <div class="add-contact" onclick="addContact()">
          <span>Kontaktperson hinzufügen</span>
          <span class="plus">+</span>
        </div>

      </div>


      <!-- Buttons -->
      <div class="bottom-buttons">
        <button onclick="saveAndGo()" class="save-btn">💾 Speichern</button>
        <button onclick="goBack()" class="cancel-btn">← Zurück</button>
      </div>

    </section>

  </main>


  <script src="script.js"></script>
</body>
</html>
